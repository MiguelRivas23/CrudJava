server.port=8080

# JWT: cambia el secreto por uno propio (mínimo 32 caracteres)
jwt.secret=clave-secreta-de-ejemplo-cambiala-por-una-larga-y-aleatoria-123456
# Duración del token: 1 hora
jwt.expiration-ms=3600000

# Oracle: esquema/usuario crud_db (ver oracle/crear_crud_db.sql)
# Oracle XE 18c/21c: servicio XEPDB1  |  Oracle XE 11g: usa jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=crud_db
spring.datasource.password=crud_db
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Crea/ajusta las tablas si faltan (si ya corriste el script SQL, no cambia nada)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
