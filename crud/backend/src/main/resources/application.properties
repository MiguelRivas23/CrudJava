server.port=8080

# JWT: cambia el secreto por uno propio (mínimo 32 caracteres) y no lo subas al repo en un proyecto real
jwt.secret=clave-secreta-de-ejemplo-cambiala-por-una-larga-y-aleatoria-123456
# Duración del token: 1 hora
jwt.expiration-ms=3600000

# H2 en archivo: los datos persisten entre reinicios (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/personasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
